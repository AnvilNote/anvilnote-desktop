name: Build native Windows and Linux release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.1.20

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: anvilnote-desktop
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-web
          path: anvilnote-web
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-api
          path: anvilnote-api
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-ai-writer
          path: anvilnote-ai-writer
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-renderer
          path: anvilnote-renderer
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-docx-exporter
          path: anvilnote-docx-exporter
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-charts
          path: anvilnote-charts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      # anvilnote-charts (below) is a pure-Python/uv project, not a Node
      # package — it has no package.json, so it's deliberately excluded from
      # the "Install Node dependencies" repo loop just below (a bare `pnpm
      # install` against it fails immediately with ERR_PNPM_NO_PKG_MANIFEST,
      # before this job ever reaches the actual Windows build step). uv
      # manages its own Python install on demand, so no separate
      # actions/setup-python step is needed here.
      - uses: astral-sh/setup-uv@v9

      - name: Build AI Writer dependency
        working-directory: anvilnote-ai-writer
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Node dependencies
        shell: pwsh
        run: |
          $repos = @(
            "anvilnote-desktop",
            "anvilnote-web",
            "anvilnote-api",
            "anvilnote-renderer",
            "anvilnote-docx-exporter"
          )
          foreach ($repo in $repos) {
            Push-Location $repo
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }

      - name: Build Windows installer
        working-directory: anvilnote-desktop
        run: pnpm dist:win

      - name: Upload Windows asset
        working-directory: anvilnote-desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "AnvilNote Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          gh release upload $env:RELEASE_TAG $installer.FullName --clobber

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: anvilnote-desktop
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-web
          path: anvilnote-web
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-api
          path: anvilnote-api
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-ai-writer
          path: anvilnote-ai-writer
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-renderer
          path: anvilnote-renderer
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-docx-exporter
          path: anvilnote-docx-exporter
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-charts
          path: anvilnote-charts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      # anvilnote-charts (below) is a pure-Python/uv project, not a Node
      # package — it has no package.json, so it's deliberately excluded from
      # the "Install Node dependencies" repo loop just below (a bare `pnpm
      # install` against it fails immediately with ERR_PNPM_NO_PKG_MANIFEST,
      # before this job ever reaches "Assemble native Linux runtime", which
      # is what actually needs it). uv manages its own Python install on
      # demand, so no separate actions/setup-python step is needed here.
      - uses: astral-sh/setup-uv@v9

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libarchive-tools

      - name: Build AI Writer dependency
        working-directory: anvilnote-ai-writer
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Node dependencies
        run: |
          for repo in \
            anvilnote-desktop \
            anvilnote-web \
            anvilnote-api \
            anvilnote-renderer \
            anvilnote-docx-exporter
          do
            pnpm --dir "$repo" install --frozen-lockfile
          done

      - name: Assemble native Linux runtime
        working-directory: anvilnote-desktop
        run: |
          pnpm fetch:typst:linux
          pnpm fetch:pandoc:linux
          pnpm prepare:desktop
          pnpm fetch:tectonic:target
          pnpm build:main

      - name: Build Linux packages
        working-directory: anvilnote-desktop
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            pnpm exec electron-builder --linux AppImage deb --x64 --config electron-builder.config.cjs --publish never
          else
            pnpm exec electron-builder --linux AppImage --arm64 --config electron-builder.config.cjs --publish never
          fi

      - name: Upload Linux assets
        working-directory: anvilnote-desktop
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb --clobber
          else
            gh release upload "$RELEASE_TAG" release/*.AppImage --clobber
          fi
