name: Build native Windows and Linux release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v0.1.20

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: anvilnote-desktop
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-web
          path: anvilnote-web
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-api
          path: anvilnote-api
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-ai-writer
          path: anvilnote-ai-writer
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-renderer
          path: anvilnote-renderer
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-docx-exporter
          path: anvilnote-docx-exporter
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-charts
          path: anvilnote-charts
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-funcs
          path: anvilnote-funcs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build AI Writer dependency
        working-directory: anvilnote-ai-writer
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Node dependencies
        shell: pwsh
        run: |
          $repos = @(
            "anvilnote-desktop",
            "anvilnote-web",
            "anvilnote-api",
            "anvilnote-renderer",
            "anvilnote-docx-exporter",
            "anvilnote-charts"
          )
          foreach ($repo in $repos) {
            Push-Location $repo
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }

      - name: Install funcs dependencies
        working-directory: anvilnote-funcs
        shell: pwsh
        run: |
          python -m pip install poetry
          poetry install --no-interaction

      - name: Build Windows installer
        working-directory: anvilnote-desktop
        run: pnpm dist:win

      - name: Verify packaged funcs sidecar and health endpoint
        working-directory: anvilnote-desktop
        shell: pwsh
        run: |
          $sidecar = (Resolve-Path "release/win-unpacked/resources/funcs/anvilnote-funcs.exe").Path
          node --input-type=module -e "import('./scripts/funcs-target.mjs').then(m => m.assertFuncsBinaryTarget(process.argv[1], 'win32', 'x64'))" "$sidecar"
          $env:PORT = "18100"
          $process = Start-Process -FilePath $sidecar -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18100/health" -TimeoutSec 2
                if ($response.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) { throw "Windows funcs sidecar health check timed out" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows asset
        working-directory: anvilnote-desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "AnvilNote Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          gh release upload $env:RELEASE_TAG $installer.FullName --clobber

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: anvilnote-desktop
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-web
          path: anvilnote-web
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-api
          path: anvilnote-api
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-ai-writer
          path: anvilnote-ai-writer
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-renderer
          path: anvilnote-renderer
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-docx-exporter
          path: anvilnote-docx-exporter
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-charts
          path: anvilnote-charts
      - uses: actions/checkout@v4
        with:
          repository: AnvilNote/anvilnote-funcs
          path: anvilnote-funcs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libarchive-tools
          python -m pip install poetry

      - name: Build AI Writer dependency
        working-directory: anvilnote-ai-writer
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Node dependencies
        run: |
          for repo in \
            anvilnote-desktop \
            anvilnote-web \
            anvilnote-api \
            anvilnote-renderer \
            anvilnote-docx-exporter \
            anvilnote-charts
          do
            pnpm --dir "$repo" install --frozen-lockfile
          done

      - name: Install funcs dependencies
        working-directory: anvilnote-funcs
        run: poetry install --no-interaction

      - name: Assemble native Linux runtime
        working-directory: anvilnote-desktop
        run: |
          pnpm fetch:typst:linux
          pnpm fetch:pandoc:linux
          pnpm prepare:desktop
          pnpm fetch:tectonic:target
          pnpm verify:funcs
          pnpm build:main

      - name: Build Linux packages
        working-directory: anvilnote-desktop
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            pnpm exec electron-builder --linux AppImage deb --x64 --config electron-builder.config.cjs --publish never
          else
            pnpm exec electron-builder --linux AppImage --arm64 --config electron-builder.config.cjs --publish never
          fi

      - name: Verify packaged funcs sidecar and health endpoint
        working-directory: anvilnote-desktop
        run: |
          sidecar="$(find release -path '*/resources/funcs/anvilnote-funcs' -type f -print -quit)"
          test -n "$sidecar"
          node --input-type=module -e "import('./scripts/funcs-target.mjs').then(m => m.assertFuncsBinaryTarget(process.argv[1], 'linux', process.argv[2]))" "$sidecar" "${{ matrix.arch }}"
          PORT=18100 "$sidecar" &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18100/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo "Linux funcs sidecar health check timed out" >&2
          exit 1

      - name: Upload Linux assets
        working-directory: anvilnote-desktop
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb --clobber
          else
            gh release upload "$RELEASE_TAG" release/*.AppImage --clobber
          fi
